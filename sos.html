<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Safety SOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🛡️ Hostel Guard SOS</h1>
            <p>Instant Emergency Alert System</p>
        </header>

        <section class="card setup-section">
            <h3>⚙️ Setup Emergency Contacts</h3>
            <input type="tel" id="contactPhone" placeholder="Warden/Parent Phone Number (with country code)">
            <button id="saveConfigBtn" class="btn-secondary">Save Contact</button>
        </section>

        <section class="card type-section">
            <h3>⚠️ Select Situation (Optional)</h3>
            <div class="options-grid">
                <label class="option-tile">
                    <input type="radio" name="emergencyType" value="Medical Emergency" checked>
                    <span>🩺 Health</span>
                </label>
                <label class="option-tile">
                    <input type="radio" name="emergencyType" value="Harassment/Safety Threat">
                    <span>🛑 Threat</span>
                </label>
                <label class="option-tile">
                    <input type="radio" name="emergencyType" value="Accident/Injury">
                    <span>🤕 Accident</span>
                </label>
                <label class="option-tile">
                    <input type="radio" name="emergencyType" value="Theft/Intrusion">
                    <span>🚨 Theft</span>
                </label>
            </div>
        </section>

<h2>Report Complaint</h2>

<textarea id="complaint"
placeholder="Write complaint"></textarea>

<button onclick="submitComplaint()">
Submit Complaint
</button>

        <section class="panic-section">
            <button id="sosBtn" class="sos-button">
                <span class="pulse"></span>
                <span class="text">SEND SOS</span>
            </button>

<h2>Emergency Contact</h2>

<input type="text" id="contactName" placeholder="Parent Name">

<input type="text" id="contactNumber" placeholder="Phone Number">

<button onclick="saveContact()">
Save Contact
</button>


            <p id="statusLocation">Location Status: Not requested</p>
        </section>
    </div>

    <script src="script.js"></script>

<h1>🚨 Student Safety Dashboard</h1>

<button id="sosBtn">SEND SOS ALERT</button>

<p id="status"></p>

<script src="script.js"></script>

<button onclick="logout()">
Logout
</button>

</body>
</html>
