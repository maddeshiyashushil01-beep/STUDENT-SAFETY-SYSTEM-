<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Safety Dashboard</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">
<div class="profile-header">

    <img id="studentPhoto"
         src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
         alt="Student">

    <h3 id="studentName">Student</h3>

    <h1>Hostel Guard</h1>

    <p>Student Safety System</p>

</div>


<div class="card">

<h2>👨 Emergency Contact</h2>

<input
type="text"
id="contactName"
placeholder="Parent / Guardian Name">

<input
type="text"
id="contactNumber"
placeholder="Phone Number">

<button class="blue-btn" onclick="saveContact()">
💾 Save Contact
</button>

</div>


<div class="card">

<h2>🚨 Emergency Type</h2>

<div class="radio-grid">

<label>
<input type="radio"
name="emergencyType"
value="Medical Emergency"
checked>

❤️ Medical
</label>

<label>
<input type="radio"
name="emergencyType"
value="Safety Threat">

🛑 Threat
</label>

<label>
<input type="radio"
name="emergencyType"
value="Accident">

🚑 Accident
</label>

<label>
<input type="radio"
name="emergencyType"
value="Theft">

🔒 Theft
</label>

</div>

</div>



<div class="sos-box">

<button
id="sosBtn"
class="sos-btn">

SOS

</button>

<p>Tap only during emergency</p>

</div>



<div class="card">

<h2>📝 Complaint</h2>

<textarea
id="complaint"
placeholder="Write your complaint here..."></textarea>

<button
class="blue-btn"
onclick="submitComplaint()">

Submit Complaint

</button>

</div>


<div class="card">

<h2>📍 Live Location</h2>

<button
class="blue-btn"
onclick="getLocation()">

Share Location

</button>

<p id="location"></p>

</div>


<button
class="logout-btn"
onclick="logout()">

Logout

</button>
<a href="profile.html" class="profile-btn">
    👤 My Profile
</a>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
