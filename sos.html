<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Safety Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🚨 Student Safety Dashboard</h1>
        <p>Instant Emergency Support</p>
    </div>

    <div class="card">
        <h3>Emergency Contact</h3>

        <input type="text" id="contactName" placeholder="Parent Name">

        <input type="text" id="contactNumber" placeholder="Phone Number">

        <button onclick="saveContact()">
            Save Contact
        </button>
    </div>

    <div class="card">
        <h3>Select Emergency Type</h3>

        <label>
            <input type="radio"
                   name="emergencyType"
                   value="Medical Emergency"
                   checked>
            Health
        </label>

        <label>
            <input type="radio"
                   name="emergencyType"
                   value="Safety Threat">
            Threat
        </label>

        <label>
            <input type="radio"
                   name="emergencyType"
                   value="Accident">
            Accident
        </label>

        <label>
            <input type="radio"
                   name="emergencyType"
                   value="Theft">
            Theft
        </label>
    </div>

    <div class="sos-container">
        <button id="sosBtn" class="sos-button">
            SOS
        </button>
    </div>

    <div class="card">
        <h3>Complaint</h3>

        <textarea id="complaint"
                  placeholder="Write complaint"></textarea>

        <button onclick="submitComplaint()">
            Submit Complaint
        </button>
    </div>

    <div class="card">
        <h3>Location Sharing</h3>

        <button onclick="getLocation()">
            Share Location
        </button>

        <p id="location"></p>
    </div>

    <button onclick="logout()">
        Logout
    </button>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
