<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student AI Agent</title>

    <link rel="stylesheet" href="agent.css">
</head>

<body>

<div class="agent-app">

    <header class="agent-header">

        <button onclick="window.location.href='sos.html'">
            ← Back
        </button>

        <div>
            <h1>🤖 Student Agent</h1>
            <p>Your personal AI assistant</p>
        </div>

    </header>


    <main class="chat-container">

        <div id="chatMessages" class="chat-messages">

            <div class="message bot">
                <div class="avatar">🤖</div>

                <div class="bubble">
                    Hello! 👋 I'm your Student Agent.
                    <br><br>
                    I can help you with study, career,
                    resume, projects and more.
                </div>
            </div>

        </div>


        <div class="quick-actions">

            <button onclick="quickAsk('Help me create a study plan')">
                📚 Study Plan
            </button>

            <button onclick="quickAsk('Help me improve my resume')">
                📄 Resume
            </button>

            <button onclick="quickAsk('What skills should I learn?')">
                🎯 Skills
            </button>

            <button onclick="quickAsk('Give me an ECE project idea')">
                💡 Project
            </button>

        </div>


        <div class="input-area">

            <textarea
                id="userInput"
                placeholder="Ask your Student Agent..."
                rows="1"
            ></textarea>

            <button id="sendBtn">
                ➤
            </button>

        </div>

    </main>

</div>

<script src="agent.js"></script>

</body>
</html>
