<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hostel Guard</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="app-container">

        <header>
            <h1>🔐 Secure Gateway</h1>
            <p>Hostel Guard Safety System</p>
        </header>

<p>
New Student?
<a href="register.html">
Create Account
</a>
</p>

<button type="button" id="createAccountBtn">
Create Account
</button>
        <section class="card login-card">

            <h3>Choose Your Role</h3>

            <div class="role-selector">
                <button id="roleStudent" class="btn-role active">🧑‍🎓 Student</button>
                <button id="roleParent" class="btn-role">👨‍👩‍👧 Parent</button>
            </div>

           <form id="loginForm" class="login-form">

  <div class="input-group">
    <label for="role">Choose Your Role</label>
    <select id="role">
      <option value="student">🧑‍🎓 Student</option>
      <option value="parent">👨‍👩‍👧 Parent</option>
    </select>
  </div>

  <div class="input-group">
    <label for="username">User ID / Mobile</label>
    <input
      type="text"
      id="username"
      placeholder="Enter your ID or Phone"
      required>
  </div>

  <div class="input-group">
    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter Password"
      required>
  </div>

  <button type="submit" class="btn-secondary">
    Access Dashboard
  </button>

</form>

<p id="errorMsg" class="error-text"></p>


      </section>

    </div>

    <script src="login.js"></script>
<script type="module" src="register.js"></script>

</body>
</html>
