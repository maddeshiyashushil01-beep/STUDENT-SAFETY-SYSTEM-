<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Safety System</title>

<link rel="stylesheet" href="login.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="left">

<div class="logo">
🛡
</div>

<h1>Student Safety System</h1>

<p>
AI Powered Campus Safety Platform
</p>

<ul>

<li><i class="fa-solid fa-location-dot"></i> Live Location Sharing</li>

<li><i class="fa-solid fa-triangle-exclamation"></i> Emergency SOS</li>

<li><i class="fa-solid fa-book-open"></i> AI Study Assistant</li>

<li><i class="fa-solid fa-calendar-days"></i> Classes & Events</li>

<li><i class="fa-solid fa-bell"></i> Smart Notices</li>

</ul>

</div>

<div class="right">

<div class="login-box">

<h2>Welcome Back 👋</h2>

<p>Login to Continue</p>

<form id="loginForm">

<div class="input-box">

<label>Login As</label>

<select id="role">

<option value="student">🎓 Student</option>

<option value="admin">👨‍💼 Admin</option>

</select>

</div>

<div class="input-box">

<label>Email</label>

<input
type="email"
id="username"
placeholder="Enter Email"
required>

</div>

<div class="input-box">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter Password"
required>

</div>

<button
type="submit"
class="login-btn">

<i class="fa-solid fa-right-to-bracket"></i>

Login

</button>

<p id="errorMsg"></p>

<div class="links">

<a href="register.html">

Create New Account

</a>

</div>

</form>

</div>

</div>

</div>

<script type="module" src="login.js"></script>

</body>
</html>
