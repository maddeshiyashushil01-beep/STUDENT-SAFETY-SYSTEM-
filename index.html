<!DOCTYPE html>  <html lang="en">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>Login - Hostel Guard</title>  
  <link rel="stylesheet" href="login.css">  
</head>  
<body>  <div class="app-container">    <div class="login-card">  <div class="header-box">  
  <h1>🔐 Secure Gateway</h1>  
  <p>Hostel Guard Safety System</p>  
</div>  

<div class="form-box">  

  <h3>Login to Continue</h3>  

  <form id="loginForm" class="login-form">  

    <div class="input-group">  
      <label for="role">Choose Your Role</label>  
      <select id="role">  
        <option value="student">🧑‍🎓 Student</option>  
        <option value="admin">👨‍👩‍👧 Admin</option>  
      </select>  
    </div>  

    <div class="input-group">  
      <label for="username">Email</label>  
      <input  
        type="email"  
        id="username"  
        placeholder="Enter Email Address"  
        required  
      >  
    </div>  

    <div class="input-group">  
      <label for="password">Password</label>  
      <input  
        type="password"  
        id="password"  
        placeholder="Enter Password"  
        required  
      >  
    </div>  

    <button type="submit" class="btn-login">  
      Access Dashboard  
    </button>  

  </form>  

  <p id="errorMsg" class="error-text"></p>  

  <div class="create-link">  
    New Student?  
    <a href="register.html">  
      Create Account  
    </a>  
  </div>  

</div>

  </div>  </div>  <script type="module" src="login.js"></script>  </body>  
</html>
